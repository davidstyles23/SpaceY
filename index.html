<!DOCTYPE html>
<html>
<head>
    <title>SpaceY</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: black;
            color: white;
            overflow-x: hidden;
        }

        header {
            position: fixed;
            width: 100%;
            padding: 20px 40px;
            background: rgba(0,0,0,0.6);
            font-weight: 800;
            z-index: 10;
        }

        /* Video Background */
        .video-bg {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1;
            object-fit: cover;
            opacity: 0.6;
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 60px;
        }

        section {
            padding: 80px 60px;
            background: black;
        }

        .card {
            background: #111;
            padding: 30px;
            margin-bottom: 20px;
        }

        input, button {
            width: 100%;
            margin-bottom: 10px;
            padding: 10px;
            background: #111;
            border: 1px solid #333;
            color: white;
        }

        button {
            background: white;
            color: black;
            cursor: pointer;
        }

        #adminPanel {
            display: none;
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            padding: 30px;
            width: 300px;
            z-index: 20;
        }
    </style>
</head>

<body>

<video autoplay muted loop class="video-bg">
    <source src="https://cdn.coverr.co/videos/coverr-rocket-launch-1571/1080p.mp4" type="video/mp4">
</video>

<header>ORBITAL DYNAMICS</header>

<div class="hero">
    <h1 id="launchName">Integrated Flight Test 1</h1>
    <h2 id="launchDate">March 7, 2026</h2>
</div>

<section>
    <div class="card">
        <h3>LIVE STATUS</h3>
        <p>Status: <span id="status">PREPARING</span></p>
        <p>Altitude: <span id="altitude">0</span></p>
        <p>Speed: <span id="speed">0</span></p>
    </div>
</section>

<section>
    <div class="card">
        <h3>MISSION NEWS</h3>
        <ul id="newsList"></ul>
    </div>
</section>

<!-- LOGIN PANEL -->
<div id="loginPanel">
    <section>
        <div class="card">
            <h3>ADMIN LOGIN</h3>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Login</button>
        </div>
    </section>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
    <h3>ADMIN CONTROL</h3>
    <input id="adminLaunchName" placeholder="Launch Name">
    <input id="adminLaunchDate" placeholder="Launch Date">
    <input id="adminStatus" placeholder="Status">
    <input id="adminAltitude" placeholder="Altitude">
    <input id="adminSpeed" placeholder="Speed">
    <input id="adminNews" placeholder="News Update">
    <button onclick="updateData()">Update</button>
    <button onclick="logout()">Logout</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB_Jk7tFViWoa-Sh0WT5NCHNt3KKlomeTI",
  authDomain: "spacey-1b9d2.firebaseapp.com",
  databaseURL: "https://spacey-1b9d2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "spacey-1b9d2",
  storageBucket: "spacey-1b9d2.firebasestorage.app",
  messagingSenderId: "116458770590",
  appId: "1:116458770590:web:ef38bfbe02fead0c916b8f"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const missionRef = ref(db, "mission");

// Real-time updates
onValue(missionRef, (snapshot) => {
  const data = snapshot.val();
  if(data){
    document.getElementById("launchName").innerText = data.launchName;
    document.getElementById("launchDate").innerText = data.launchDate;
    document.getElementById("status").innerText = data.status;
    document.getElementById("altitude").innerText = data.altitude;
    document.getElementById("speed").innerText = data.speed;

    let newsList = document.getElementById("newsList");
    newsList.innerHTML = "";
    data.news?.forEach(item => {
      let li = document.createElement("li");
      li.innerText = item;
      newsList.appendChild(li);
    });
  }
});

// Login
window.login = function(){
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    signInWithEmailAndPassword(auth, email, password)
    .catch(error => alert(error.message));
}

// Auth state
onAuthStateChanged(auth, (user) => {
    if(user){
        document.getElementById("adminPanel").style.display = "block";
        document.getElementById("loginPanel").style.display = "none";
    } else {
        document.getElementById("adminPanel").style.display = "none";
        document.getElementById("loginPanel").style.display = "block";
    }
});

// Update Data
window.updateData = function(){
    let newData = {
        launchName: document.getElementById("adminLaunchName").value,
        launchDate: document.getElementById("adminLaunchDate").value,
        status: document.getElementById("adminStatus").value,
        altitude: document.getElementById("adminAltitude").value,
        speed: document.getElementById("adminSpeed").value,
        news: [document.getElementById("adminNews").value]
    };

    set(missionRef, newData);
}

// Logout
window.logout = function(){
    signOut(auth);
}

</script>

</body>
</html>
