<!DOCTYPE html>
<html>
<head>
<title>Starship Factory | Mission Control</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:black;
color:white;
overflow-x:hidden;
}

video {
position:fixed;
right:0;
bottom:0;
min-width:100%;
min-height:100%;
z-index:-1;
object-fit:cover;
filter:brightness(40%);
}

header {
text-align:center;
padding:40px 20px;
font-size:28px;
letter-spacing:3px;
}

.panel {
background:rgba(0,0,0,0.7);
padding:30px;
margin:20px auto;
width:90%;
max-width:900px;
border:1px solid #222;
}

.status {
font-size:22px;
margin:10px 0;
}

.countdown {
font-size:32px;
font-weight:bold;
}

button {
padding:10px 15px;
background:#111;
color:white;
border:1px solid #444;
cursor:pointer;
margin:5px 0;
}

button:hover {
background:#222;
}

input {
padding:8px;
margin:5px 0;
width:100%;
background:#111;
border:1px solid #333;
color:white;
}

#adminPanel {
display:none;
}
</style>
</head>

<body>

<video autoplay muted loop>
<source src="your-video.mp4" type="video/mp4">
</video>

<header>
STARSHIP FACTORY  
<br>
MISSION CONTROL
</header>

<div class="panel">
<div id="missionName">Mission: Loading...</div>
<div id="rocketName">Vehicle: Loading...</div>
<div class="status" id="missionStatus">Status: Awaiting Data</div>
<div class="countdown" id="countdownDisplay">T-00:00:00:00</div>
</div>

<div class="panel" id="loginPanel">
<h3>Admin Login</h3>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div class="panel" id="adminPanel">
<h3>Admin Control</h3>

<input type="text" id="adminMission" placeholder="Mission Name">
<input type="text" id="adminRocket" placeholder="Rocket Name">
<input type="datetime-local" id="adminLaunch">

<button onclick="updateMission()">Update Mission</button>
<button onclick="abortMission()">Abort</button>
<button onclick="resetMission()">Reset</button>
<button onclick="logout()">Logout</button>
</div>

<script type="module">

// 🔥 PASTE YOUR FIREBASE CONFIG HERE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
apiKey: "PASTE_HERE",
authDomain: "PASTE_HERE",
databaseURL: "PASTE_HERE",
projectId: "PASTE_HERE",
storageBucket: "PASTE_HERE",
messagingSenderId: "PASTE_HERE",
appId: "PASTE_HERE"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const missionRef = ref(db, "mission");

let countdownInterval = null;
let phaseTimeout = null;

// 🚀 Countdown Engine
function startCountdown(dateString) {

if(countdownInterval) clearInterval(countdownInterval);

const target = new Date(dateString).getTime();

countdownInterval = setInterval(()=>{
const now = new Date().getTime();
const distance = target - now;

if(distance <= 0){
clearInterval(countdownInterval);
startMissionSequence();
return;
}

const days = Math.floor(distance / (1000*60*60*24));
const hours = Math.floor((distance % (1000*60*60*24))/(1000*60*60));
const minutes = Math.floor((distance % (1000*60*60))/(1000*60));
const seconds = Math.floor((distance % (1000*60))/1000);

document.getElementById("countdownDisplay").innerText =
`T-${days}:${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;

},1000);
}

// 🚀 Automatic Mission Phases
function startMissionSequence(){

const phases = [
{status:"IGNITION SEQUENCE START", delay:0},
{status:"LIFTOFF", delay:5000},
{status:"MAX-Q", delay:20000},
{status:"STAGE SEPARATION", delay:60000},
{status:"ORBIT CONFIRMED", delay:120000}
];

phases.forEach(phase=>{
setTimeout(()=>{
set(missionRef,{
...currentMission,
status:phase.status
});
},phase.delay);
});
}

let currentMission = {};

onValue(missionRef,(snapshot)=>{
const data = snapshot.val();
if(!data) return;

currentMission = data;

document.getElementById("missionName").innerText = "Mission: " + data.mission;
document.getElementById("rocketName").innerText = "Vehicle: " + data.rocket;
document.getElementById("missionStatus").innerText = "Status: " + data.status;

if(data.launchDate){
startCountdown(data.launchDate);
}
});

// 🔐 Auth
window.login = function(){
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

signInWithEmailAndPassword(auth,email,password)
.then(()=>{
document.getElementById("adminPanel").style.display="block";
document.getElementById("loginPanel").style.display="none";
});
}

window.logout = function(){
signOut(auth);
document.getElementById("adminPanel").style.display="none";
document.getElementById("loginPanel").style.display="block";
}

// 🛰 Admin Controls
window.updateMission = function(){
const mission = document.getElementById("adminMission").value;
const rocket = document.getElementById("adminRocket").value;
const launchDate = document.getElementById("adminLaunch").value;

set(missionRef,{
mission,
rocket,
launchDate,
status:"COUNTDOWN"
});
}

window.abortMission = function(){
set(missionRef,{
...currentMission,
status:"MISSION ABORTED"
});
}

window.resetMission = function(){
set(missionRef,{
mission:"",
rocket:"",
launchDate:"",
status:"AWAITING NEW MISSION"
});
}

</script>

</body>
</html>
