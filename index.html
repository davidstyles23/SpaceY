<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Y</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
* {
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter', sans-serif;
}

body {
background:black;
color:white;
overflow-x:hidden;
}

/* VIDEO BACKGROUND */
video {
position:fixed;
right:0;
bottom:0;
min-width:100%;
min-height:100%;
object-fit:cover;
z-index:-2;
filter:brightness(35%);
}

/* DARK OVERLAY */
.overlay {
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0.95));
z-index:-1;
}

/* HEADER */
header {
padding:40px 8%;
display:flex;
justify-content:space-between;
align-items:center;
letter-spacing:2px;
}

.logo {
font-weight:800;
font-size:18px;
}

.logo span {
font-weight:300;
opacity:0.7;
}

.status-badge {
padding:8px 14px;
border:1px solid rgba(255,255,255,0.2);
font-size:12px;
letter-spacing:1px;
text-transform:uppercase;
}

/* MAIN GRID */
.container {
width:84%;
margin:auto;
margin-top:80px;
display:grid;
grid-template-columns:2fr 1fr;
gap:40px;
}

/* MAIN MISSION PANEL */
.main-panel {
backdrop-filter:blur(12px);
background:rgba(255,255,255,0.05);
padding:60px;
border:1px solid rgba(255,255,255,0.08);
}

.mission-title {
font-size:36px;
font-weight:600;
margin-bottom:10px;
}

.rocket-name {
font-size:14px;
letter-spacing:2px;
opacity:0.6;
margin-bottom:40px;
}

.countdown {
font-size:52px;
font-weight:800;
letter-spacing:4px;
margin-bottom:20px;
}

.phase {
font-size:18px;
letter-spacing:2px;
opacity:0.8;
}

/* SIDE PANEL */
.side-panel {
backdrop-filter:blur(12px);
background:rgba(255,255,255,0.05);
padding:40px;
border:1px solid rgba(255,255,255,0.08);
}

.side-panel h3 {
margin-bottom:20px;
font-weight:400;
letter-spacing:2px;
font-size:14px;
opacity:0.7;
}

input {
width:100%;
padding:10px;
margin-bottom:15px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
color:white;
}

button {
width:100%;
padding:10px;
background:transparent;
border:1px solid rgba(255,255,255,0.2);
color:white;
cursor:pointer;
transition:all 0.3s;
margin-bottom:10px;
}

button:hover {
background:white;
color:black;
}

#adminPanel {
display:none;
}
</style>
</head>

<body>

<video autoplay muted loop>
<source src="launch.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<header>
<div class="logo">
SpaceY<span>Mission Control</span>
</div>
<div class="status-badge" id="statusBadge">
AWAITING DATA
</div>
</header>

<div class="container">

<div class="main-panel">
<div class="mission-title" id="missionName">Loading Mission...</div>
<div class="rocket-name" id="rocketName">Loading Vehicle...</div>
<div class="countdown" id="countdownDisplay">T-00:00:00:00</div>
<div class="phase" id="missionPhase">STANDBY</div>
</div>

<div class="side-panel">

<div id="loginPanel">
<h3>ADMIN ACCESS</h3>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
</div>

<div id="adminPanel">
<h3>MISSION CONTROL</h3>
<input type="text" id="adminMission" placeholder="Mission Name">
<input type="text" id="adminRocket" placeholder="Rocket Name">
<input type="datetime-local" id="adminLaunch">
<button onclick="updateMission()">UPDATE</button>
<button onclick="abortMission()">ABORT</button>
<button onclick="resetMission()">RESET</button>
<button onclick="logout()">LOGOUT</button>
</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB_Jk7tFViWoa-Sh0WT5NCHNt3KKlomeTI",
  authDomain: "spacey-1b9d2.firebaseapp.com",
  databaseURL: "https://spacey-1b9d2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "spacey-1b9d2",
  storageBucket: "spacey-1b9d2.firebasestorage.app",
  messagingSenderId: "116458770590",
  appId: "1:116458770590:web:ef38bfbe02fead0c916b8f"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const missionRef = ref(db, "mission");

let countdownInterval = null;
let currentMission = {};

function startCountdown(dateString){
if(countdownInterval) clearInterval(countdownInterval);

const target = new Date(dateString).getTime();

countdownInterval = setInterval(()=>{
const now = new Date().getTime();
const distance = target - now;

if(distance <= 0){
clearInterval(countdownInterval);
startMissionSequence();
return;
}

const d = Math.floor(distance / (1000*60*60*24));
const h = Math.floor((distance % (1000*60*60*24))/(1000*60*60));
const m = Math.floor((distance % (1000*60*60))/(1000*60));
const s = Math.floor((distance % (1000*60))/1000);

document.getElementById("countdownDisplay").innerText =
`T-${d}:${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;

},1000);
}

function startMissionSequence(){
const phases = [
{status:"IGNITION", delay:0},
{status:"LIFTOFF", delay:5000},
{status:"MAX-Q", delay:20000},
{status:"STAGE SEPARATION", delay:60000},
{status:"ORBIT CONFIRMED", delay:120000}
];

phases.forEach(phase=>{
setTimeout(()=>{
set(missionRef,{
...currentMission,
status:phase.status
});
},phase.delay);
});
}

onValue(missionRef,(snapshot)=>{
const data = snapshot.val();
if(!data) return;

currentMission = data;

document.getElementById("missionName").innerText = data.mission;
document.getElementById("rocketName").innerText = data.rocket;
document.getElementById("missionPhase").innerText = data.status;
document.getElementById("statusBadge").innerText = data.status;

if(data.launchDate){
startCountdown(data.launchDate);
}
});

window.login = function(){
signInWithEmailAndPassword(auth,email.value,password.value)
.then(()=>{
adminPanel.style.display="block";
loginPanel.style.display="none";
});
}

window.logout = function(){
signOut(auth);
adminPanel.style.display="none";
loginPanel.style.display="block";
}

window.updateMission = function(){
set(missionRef,{
mission:adminMission.value,
rocket:adminRocket.value,
launchDate:adminLaunch.value,
status:"COUNTDOWN"
});
}

window.abortMission = function(){
set(missionRef,{
...currentMission,
status:"MISSION ABORTED"
});
}

window.resetMission = function(){
set(missionRef,{
mission:"",
rocket:"",
launchDate:"",
status:"AWAITING NEW MISSION"
});
}

</script>
</body>
</html>
