<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpaceY</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* NAVBAR */

.navbar{
position:fixed;
width:100%;
padding:20px 60px;
display:flex;
justify-content:space-between;
z-index:10;
letter-spacing:2px;
font-size:14px;
}

/* VIDEO BACKGROUND */

.video-container{
position:relative;
height:100vh;
overflow:hidden;
}

video{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.65);
}

/* HERO */

.hero{
position:relative;
z-index:2;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.hero h1{
font-size:60px;
letter-spacing:4px;
font-weight:800;
}

.status{
font-size:40px;
margin-top:20px;
font-weight:300;
}

/* LIVE STREAM */

.broadcast{
padding:80px 0;
background:black;
text-align:center;
}

.broadcast iframe{
width:80%;
height:500px;
border:none;
}

/* MISSION CONTROL */

.control{
padding:80px 10%;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:40px;
background:#0a0a0a;
}

.card{
border-top:2px solid white;
padding:20px;
}

.card h3{
font-size:14px;
letter-spacing:2px;
margin-bottom:10px;
}

.card p{
font-size:22px;
font-weight:600;
}

@media(max-width:900px){
.control{
grid-template-columns:1fr;
}
}

/* ADMIN PANEL */

.admin{
position:fixed;
top:20px;
right:20px;
background:white;
color:black;
padding:15px;
display:none;
z-index:20;
}
</style>
</head>

<body>

<div class="navbar">
<div>SpaceY</div>
<div>Missions</div>
</div>

<div class="admin" id="adminPanel">
<input type="text" id="newMission" placeholder="Mission Name"><br><br>
<input type="text" id="newStatus" placeholder="Mission Status"><br><br>
<button onclick="updateMission()">Update</button>
</div>

<!-- HERO SECTION -->
<div class="video-container">
<video autoplay muted loop playsinline>
<source src="assets/launch.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="hero">
<h1 id="missionName">LOADING...</h1>
<div class="status" id="statusText">CONNECTING...</div>
</div>
</div>

<!-- LIVE STREAM -->
<div class="broadcast">
<iframe 
src="https://www.youtube.com/embed/anOzeeUy3bA?autoplay=1&mute=1&controls=0&loop=1&playlist=anOzeeUy3bA"
allow="autoplay">
</iframe>
</div>

<!-- MISSION CONTROL -->
<div class="control">
<div class="card">
<h3>MISSION STATUS</h3>
<p id="controlStatus">LOADING...</p>
</div>

<div class="card">
<h3>VEHICLE</h3>
<p>Booster 2 / Ship 4</p>
</div>

<div class="card">
<h3>Destination</h3>
<p>Indian Ocean</p>
</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 PASTE YOUR REAL FIREBASE CONFIG HERE */
const firebaseConfig = {
  apiKey: "AIzaSyB_Jk7tFViWoa-Sh0WT5NCHNt3KKlomeTI",
  authDomain: "spacey-1b9d2.firebaseapp.com",
  databaseURL: "https://spacey-1b9d2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "spacey-1b9d2",
  storageBucket: "spacey-1b9d2.firebasestorage.app",
  messagingSenderId: "116458770590",
  appId: "1:116458770590:web:ef38bfbe02fead0c916b8f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const missionRef = doc(db,"missionControl","liveMission");

/* REAL-TIME LISTENER */
onSnapshot(missionRef,(docSnap)=>{
if(docSnap.exists()){
document.getElementById("missionName").innerText = docSnap.data().mission;
document.getElementById("statusText").innerText = docSnap.data().status;
document.getElementById("controlStatus").innerText = docSnap.data().status;
}
});

/* ADMIN LOGIN */
window.addEventListener("keydown",(e)=>{
if(e.key==="Insert"){
let email = prompt("Email:");
let password = prompt("Password:");

signInWithEmailAndPassword(auth,email,password)
.then(()=>{
document.getElementById("adminPanel").style.display="block";
})
.catch(()=>alert("Access denied"));
}
});

/* UPDATE FUNCTION */
window.updateMission = async function(){
let missionName = document.getElementById("newMission").value;
let status = document.getElementById("newStatus").value;

await setDoc(missionRef,{
mission:missionName,
status:status
});

alert("Updated for everyone 🚀");
};

</script>

</body>
</html>
