<!DOCTYPE html>
<html>
<head>
    <title>SpaceY</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: black;
            color: white;
        }

        header {
            position: fixed;
            width: 100%;
            padding: 20px 40px;
            background: rgba(0,0,0,0.6);
            font-weight: 800;
            z-index: 10;
        }

        .video-bg {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.5;
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 60px;
        }

        section {
            padding: 80px 60px;
            background: black;
        }

        .card {
            background: #111;
            padding: 30px;
            margin-bottom: 20px;
        }

        .go { color: #00ff88; }
        .nogo { color: red; }

        input, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #111;
            border: 1px solid #333;
            color: white;
        }

        button {
            background: white;
            color: black;
            cursor: pointer;
        }

        #adminPanel {
            display: none;
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            background: black;
            padding: 30px;
            width: 350px;
            z-index: 20;
        }
    </style>
</head>

<body>

<video autoplay muted loop class="video-bg">
    <source src="https://cdn.coverr.co/videos/coverr-rocket-launch-1571/1080p.mp4" type="video/mp4">
</video>

<header>SpaceY</header>

<div class="hero">
    <h1 id="launchName">Integrated Flight Test 1</h1>
    <h2 id="launchDate">2026-03-07</h2>
    <h2 id="countdownDisplay"></h2>
</div>

<section>
    <div class="card">
        <h3>MISSION CONTROL</h3>

        <p>Mission Phase: <span id="phase">COUNTDOWN</span></p>
        <p>Launch Director: <span id="director" class="go">GO</span></p>

        <h4>SYSTEM STATUS</h4>
        <p>Booster: <span id="booster" class="go">GO</span></p>
        <p>Engines: <span id="engines" class="go">GO</span></p>
        <p>Guidance: <span id="guidance" class="go">GO</span></p>
        <p>Weather: <span id="weather" class="go">GO</span></p>

        <h2 id="goStatus" class="go">GO FOR LAUNCH</h2>
    </div>
</section>

<section>
    <div class="card">
        <h3>MISSION NEWS</h3>
        <ul id="newsList"></ul>
    </div>
</section>

<section id="loginPanel">
    <div class="card">
        <h3>ADMIN LOGIN</h3>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>
</section>

<div id="adminPanel">
    <h3>ADMIN CONTROL</h3>

    <input id="adminLaunchName" placeholder="Launch Name">
    <input id="adminLaunchDate" placeholder="Launch Date (YYYY-MM-DD)">
    <input id="adminPhase" placeholder="Mission Phase">
    <input id="adminDirector" placeholder="Director (GO/NO GO/PENDING)">
    <input id="adminBooster" placeholder="Booster (GO/NO GO/PENDING)">
    <input id="adminEngines" placeholder="Engines (GO/NO GO/PENDING)">
    <input id="adminGuidance" placeholder="Guidance (GO/NO GO/PENDING)">
    <input id="adminWeather" placeholder="Weather (GO/NO GO/PENDING)">
    <input id="adminGoStatus" placeholder="GO Status Text">
    <input id="adminNews" placeholder="News Update">

    <button onclick="updateData()">Update</button>
    <button onclick="logout()">Logout</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB_Jk7tFViWoa-Sh0WT5NCHNt3KKlomeTI",
  authDomain: "spacey-1b9d2.firebaseapp.com",
  databaseURL: "https://spacey-1b9d2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "spacey-1b9d2",
  storageBucket: "spacey-1b9d2.firebasestorage.app",
  messagingSenderId: "116458770590",
  appId: "1:116458770590:web:ef38bfbe02fead0c916b8f"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const missionRef = ref(db, "mission");

function updateCountdown(target){
    setInterval(() => {
        let now = new Date().getTime();
        let distance = target - now;
        if(distance <= 0){
            document.getElementById("countdownDisplay").innerText = "LIFTOFF";
            return;
        }
        let days = Math.floor(distance/(1000*60*60*24));
        let hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));
        let minutes = Math.floor((distance%(1000*60*60))/(1000*60));
        let seconds = Math.floor((distance%(1000*60))/1000);
        document.getElementById("countdownDisplay").innerText =
        `T-${days}D ${hours}H ${minutes}M ${seconds}S`;
    },1000);
}

onValue(missionRef, (snapshot)=>{
    const data = snapshot.val();
    if(!data) return;

    document.getElementById("launchName").innerText = data.launchName;
    document.getElementById("launchDate").innerText = data.launchDate;
    document.getElementById("phase").innerText = data.phase;

    function setStatus(id,value){
        let el = document.getElementById(id);
        el.innerText = value;
        el.className = value==="GO"?"go":"nogo";
    }

    setStatus("director",data.director);
    setStatus("booster",data.booster);
    setStatus("engines",data.engines);
    setStatus("guidance",data.guidance);
    setStatus("weather",data.weather);

    document.getElementById("goStatus").innerText = data.goStatus;
    updateCountdown(new Date(data.launchDate).getTime());

    let newsList = document.getElementById("newsList");
    newsList.innerHTML="";
    data.news?.forEach(n=>{
        let li=document.createElement("li");
        li.innerText=n;
        newsList.appendChild(li);
    });
});

window.login=function(){
    signInWithEmailAndPassword(auth,
        document.getElementById("email").value,
        document.getElementById("password").value
    ).catch(e=>alert(e.message));
}

window.logout=function(){ signOut(auth); }

onAuthStateChanged(auth,user=>{
    document.getElementById("adminPanel").style.display = user?"block":"none";
});

window.updateData=function(){
    let newData={
        launchName: adminLaunchName.value,
        launchDate: adminLaunchDate.value,
        phase: adminPhase.value,
        director: adminDirector.value,
        booster: adminBooster.value,
        engines: adminEngines.value,
        guidance: adminGuidance.value,
        weather: adminWeather.value,
        goStatus: adminGoStatus.value,
        news: [adminNews.value]
    };
    set(missionRef,newData);
}

</script>

</body>
</html>
