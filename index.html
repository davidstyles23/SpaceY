<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpaceY</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<style>
body{
margin:0;
background:black;
color:white;
font-family:'Montserrat',sans-serif;
}

.video-container{
position:relative;
height:100vh;
overflow:hidden;
}

video{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.65);
}

.hero{
position:relative;
z-index:2;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

h1{
font-size:60px;
letter-spacing:4px;
}

.timer{
font-size:40px;
margin-top:20px;
}

.admin{
position:fixed;
top:20px;
right:20px;
background:white;
color:black;
padding:10px;
display:none;
}
</style>
</head>

<body>

<div class="admin" id="adminPanel">
<input type="text" id="newMission" placeholder="Mission Name">
<button onclick="updateMission()">Update</button>
</div>

<div class="video-container">
<video autoplay muted loop playsinline>
<source src="assets/launch.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="hero">
<h1 id="missionName">LOADING...</h1>
<div class="timer" id="statusText">CONNECTING...</div>
</div>
</div>

<script type="module">

// 🔥 PASTE YOUR FIREBASE CONFIG HERE
const firebaseConfig = {
  apiKey: "AIzaSyB_Jk7tFViWoa-Sh0WT5NCHNt3KKlomeTI",
  authDomain: "spacey-1b9d2.firebaseapp.com",
  databaseURL: "https://spacey-1b9d2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "spacey-1b9d2",
  storageBucket: "spacey-1b9d2.firebasestorage.app",
  messagingSenderId: "116458770590",
  appId: "1:116458770590:web:ef38bfbe02fead0c916b8f"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔥 REAL-TIME LISTENER
const missionRef = doc(db, "missionControl", "liveMission");

onSnapshot(missionRef, (docSnap) => {
if(docSnap.exists()){
document.getElementById("missionName").innerText = docSnap.data().mission;
document.getElementById("statusText").innerText = docSnap.data().status;
}
});

// 🔥 ADMIN LOGIN
window.addEventListener("keydown", function(e){
if(e.key === "Insert"){
let email = prompt("Email:");
let password = prompt("Password:");

signInWithEmailAndPassword(auth,email,password)
.then(()=>{
document.getElementById("adminPanel").style.display="block";
})
.catch(()=>alert("Access denied"));
}
});

// 🔥 UPDATE MISSION
window.updateMission = async function(){
let missionName = document.getElementById("newMission").value;

await setDoc(missionRef,{
mission:missionName,
status:"GO FOR LAUNCH"
});

alert("Updated for everyone 🚀");
}

</script>

</body>
</html>
